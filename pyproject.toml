[project]
name = "contra"
version = "0.1.0"
description = "Alzheimer's research contradiction detector"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "braintrust==0.17.0",
    "fastapi>=0.115.0",
    "openai>=2.32.0",
    "pgvector>=0.4.2",
    "psycopg[binary]>=3.3.3",
    "python-dotenv>=1.2.2",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.4.1",
    "uvicorn[standard]>=0.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["contra"]

[dependency-groups]
dev = [
    "langdetect>=1.0.9",
    "requests>=2.33.1",
    "tqdm>=4.67.3",
]
